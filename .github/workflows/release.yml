name: Build and publish Windows release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish Windows x64 app
        run: dotnet publish csharp\RustToolkit.Desktop\RustToolkit.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output publish
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compile setup installer
        shell: pwsh
        run: |
          $version = '0.0.0'
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $version = $Matches[1]
          }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw "Inno Setup compiler not found at $compiler"
          }
          Push-Location installer
          & $compiler "/DAppVersion=$version" 'RustToolkit.iss'
          $compilerExitCode = $LASTEXITCODE
          Pop-Location
          if ($compilerExitCode -ne 0) {
            exit $compilerExitCode
          }
      - name: Package portable ZIP
        if: startsWith(github.ref, 'refs/tags/')
        run: Compress-Archive -Path publish\* -DestinationPath RustToolkit-${{ github.ref_name }}-win-x64.zip -CompressionLevel Optimal
      - name: Upload release package
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            RustToolkit-${{ github.ref_name }}-win-x64.zip
            artifacts/RustToolkit-Setup-v*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: windows-release
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: RustToolkit ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            RustToolkit-${{ github.ref_name }}-win-x64.zip
            artifacts/RustToolkit-Setup-v*.exe
