name: Deploy project site

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "assets/screenshots/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "assets/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Prepare site artifact
        shell: bash
        run: |
          mkdir -p _site/assets/screenshots
          cp -R site/. _site/
          cp assets/screenshots/crafting.png _site/assets/screenshots/
          cp assets/screenshots/rustplus.png _site/assets/screenshots/
          cp assets/screenshots/settings.png _site/assets/screenshots/
          cp assets/screenshots/timers.png _site/assets/screenshots/
          cp assets/screenshots/raid-planner.png _site/assets/screenshots/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
